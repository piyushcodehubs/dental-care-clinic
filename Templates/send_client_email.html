<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Email to Patient</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.07);
        }

        h1 {
            margin-top: 0;
            color: #155e75;
        }

        p {
            color: #64748b;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #0e7490;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #155e75;
        }

        .notice {
            margin: 12px 0;
            padding: 12px;
            border-radius: 6px;
            background: #ecfeff;
        }

        .errorlist {
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Send Email to Patient</h1>
        <p>Select an appointment and write a message to the patient.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="notice">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Send Email</button>
        </form>
    </div>
</body>
</html>
